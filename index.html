<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Even Split</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #CFE8B5; font-family: ui-rounded, system-ui, sans-serif; -webkit-user-select: none; user-select: none; color: #24324A; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; left: 14px; right: 14px; pointer-events: none; }
  #top { top: max(12px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; }
  #top button { pointer-events: auto; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 rgba(36,50,74,.25); color: #24324A; font: inherit; font-size: 15px; }
  #info { position: fixed; top: max(56px, calc(env(safe-area-inset-top) + 44px)); left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 800; pointer-events: none; }
  #hint { bottom: max(22px, env(safe-area-inset-bottom)); text-align: center; font-size: 15px; font-weight: 800; }
  #hint span { display: inline-block; max-width: 100%; padding: 6px 14px; border-radius: 14px; background: rgba(36,50,74,.82); color: #fff; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(36,50,74,.55); }
  .card { width: min(86vw, 330px); padding: 22px 18px; border-radius: 28px; background: #fff; text-align: center; box-shadow: 0 8px 0 #C6D2E3; }
  .card h1 { margin: 0 0 6px; font-size: 30px; }
  .card p { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: #6B778C; }
  #picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 14px; }
  #picker button { height: 54px; padding: 0; font-size: 21px; }
  #close { background: #E9EEF5; box-shadow: 0 6px 0 #C6D2E3; color: #24324A; }
  #picker button.done { background: #FFC233; box-shadow: 0 6px 0 #D19A12; color: #24324A; }
  .card button { width: 100%; height: 54px; border: 0; border-radius: 20px; background: #4CC26E; box-shadow: 0 6px 0 #2F9450; color: #fff; font: inherit; font-size: 21px; font-weight: 800; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="hud"><button id="levels">Levels</button><span><button id="undo">Undo</button> <button id="restart">Restart</button></span></div>
<div id="info"></div>
<div id="hint" class="hud"><span></span></div>
<div id="menu" class="overlay"><div class="card"><h1>Levels</h1><div id="picker"></div><button id="close">Back</button></div></div>
<div id="card" class="overlay"><div class="card"><h1 id="cardTitle"></h1><p id="cardText"></p><button id="cardBtn"></button></div></div>
<script src="flow.js"></script>
<script src="levels.js"></script>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const el = (id) => document.getElementById(id);
const key = (x, y) => `${x},${y}`;
const cellOf = (k) => k.split(',').map(Number);

let levelIndex = 0, level, gate, houses, rocks, built, strokes, drawing, flow, solved;
let W, H, cell, ox, oy;

function load(i) {
  levelIndex = i;
  level = LEVELS[i];
  gate = key(...level.gate);
  houses = new Map(level.houses.map(([x, y, n, d]) => [key(x, y), { n, d }]));
  rocks = new Set(level.rocks.map(([x, y]) => key(x, y)));
  built = (level.built || []).flatMap((s) => { const c = s.split(' '); return c.slice(1).map((k, j) => [c[j], k]); });
  strokes = [];
  drawing = null;
  solved = false;
  history.replaceState(null, '', `#${i + 1}`);
  say(level.hint);
  resize();
  update();
}

const allEdges = () => [...built, ...strokes.flat(), ...(drawing ? drawing.edges : [])];
const roadsLeft = () => (level.roads ?? Infinity) - strokes.flat().length - (drawing ? drawing.edges.length : 0);
const nodesOf = (edges) => new Set([gate, ...edges.flat()]);
const outCount = (k, edges) => edges.filter(([a]) => a === k).length;
const inCount = (k, edges) => edges.filter(([, b]) => b === k).length;

function update() {
  flow = solveFlow(allEdges(), { [gate]: 1 });
  el('info').textContent = `${levelIndex + 1}. ${level.name}` + (level.roads ? ` · Road left: ${roadsLeft()}` : '');
}

function say(text) { el('hint').firstChild.textContent = text; }

function startAt(k) {
  if (solved) return;
  const edges = allEdges();
  if (k !== gate && (!nodesOf(edges).has(k) || houses.has(k))) return say('Start from the spring or a road');
  if (outCount(k, edges) >= 2) return say('A road can split in two, never three');
  drawing = { cells: [k], edges: [], done: false, before: nodesOf(edges) };
}

function stepTo(k) {
  const { cells, edges } = drawing;
  const last = cells[cells.length - 1];
  if (k === cells[cells.length - 2]) {
    cells.pop();
    edges.pop();
    drawing.done = false;
    return true;
  }
  if (drawing.done) return false;
  const [x, y] = cellOf(k);
  if (x < 0 || y < 0 || x >= level.cols || y >= level.rows || rocks.has(k) || k === gate) return false;
  const all = allEdges();
  if (all.some(([a, b]) => (a === last && b === k) || (a === k && b === last))) return false;
  if (roadsLeft() <= 0) { say('Out of road. Undo to get some back'); return false; }
  const joins = houses.has(k) || drawing.before.has(k) || cells.includes(k);
  edges.push([last, k]);
  cells.push(k);
  drawing.done = joins;
  return true;
}

function dragTo(k) {
  let guard = 50;
  while (guard-- > 0) {
    const [lx, ly] = cellOf(drawing.cells[drawing.cells.length - 1]);
    const [tx, ty] = cellOf(k);
    if (lx === tx && ly === ty) break;
    const dx = tx - lx, dy = ty - ly;
    const next = Math.abs(dx) >= Math.abs(dy) ? key(lx + Math.sign(dx), ly) : key(lx, ly + Math.sign(dy));
    if (!stepTo(next)) break;
  }
  update();
}

function finish() {
  const d = drawing;
  drawing = null;
  if (d.edges.length) {
    if (trapped([...built, ...strokes.flat(), ...d.edges])) say('That water would go round forever');
    else strokes.push(d.edges);
  }
  update();
  checkWin();
}

function checkWin() {
  if (!flow) return;
  const ok = [...houses].every(([k, h]) => Math.abs((flow.water.get(k) || 0) - h.n / h.d) < 1e-7);
  if (!ok) return;
  solved = true;
  try { localStorage.setItem(`even-split-${levelIndex}`, '1'); } catch {}
  const i = levelIndex, last = i === LEVELS.length - 1;
  setTimeout(() => solved && levelIndex === i && card('Even!', level.why, last ? 'Play again' : 'Next', () => load(last ? 0 : levelIndex + 1)), 700);
}

function card(title, text, btn, onClick) {
  el('cardTitle').textContent = title;
  el('cardText').textContent = text;
  el('cardBtn').textContent = btn;
  el('cardBtn').onclick = () => { el('card').style.display = 'none'; onClick(); };
  el('card').style.display = 'flex';
}

el('undo').onclick = () => { if (!solved) { strokes.pop(); update(); say(level.hint); } };
el('restart').onclick = () => load(levelIndex);
el('close').onclick = () => { el('menu').style.display = 'none'; };
el('levels').onclick = () => {
  el('picker').innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    b.title = lv.name;
    try { if (localStorage.getItem(`even-split-${i}`)) b.className = 'done'; } catch {}
    b.onclick = () => { el('menu').style.display = 'none'; el('card').style.display = 'none'; load(i); };
    el('picker').appendChild(b);
  });
  el('menu').style.display = 'flex';
};

function pointerCell(e) {
  return key(Math.floor((e.clientX - ox) / cell), Math.floor((e.clientY - oy) / cell));
}
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); startAt(pointerCell(e)); });
canvas.addEventListener('pointermove', (e) => { if (drawing) dragTo(pointerCell(e)); });
canvas.addEventListener('pointerup', () => { if (drawing) finish(); });
canvas.addEventListener('pointercancel', () => { if (drawing) finish(); });

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!level) return;
  cell = Math.floor(Math.min((W - 28) / level.cols, (H - 150) / level.rows, 96));
  ox = (W - cell * level.cols) / 2;
  oy = 64 + (H - 150 - cell * level.rows) / 2;
}
addEventListener('resize', resize);

const centre = (k) => { const [x, y] = cellOf(k); return [ox + (x + 0.5) * cell, oy + (y + 0.5) * cell]; };

function line(a, b, width, colour, dx = 0, dy = 0) {
  const [ax, ay] = centre(a), [bx, by] = centre(b);
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(ax + dx, ay + dy);
  ctx.lineTo(bx + dx, by + dy);
  ctx.stroke();
}

function pill(x, y, text, bg, fg) {
  ctx.font = `800 ${Math.round(cell * 0.17)}px ui-rounded, system-ui, sans-serif`;
  const w = ctx.measureText(text).width + cell * 0.16, h = cell * 0.26;
  ctx.fillStyle = 'rgba(36,50,74,.18)';
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2 + 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg;
  ctx.fillText(text, x, y + 1);
}

function circle(x, y, r, colour) {
  ctx.fillStyle = colour;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// Stable pseudo-random number per cell, so moss and pebbles don't flicker.
const noise = (k, n) => { let h = n * 7919; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 100003; return h / 100003; };

function drawGround() {
  ctx.fillStyle = '#CFE8B5';
  ctx.fillRect(0, 0, W, H);
  const pad = cell * 0.12;
  ctx.fillStyle = 'rgba(70,120,60,.14)';
  ctx.beginPath(); ctx.roundRect(ox - pad, oy - pad + 5, cell * level.cols + pad * 2, cell * level.rows + pad * 2, cell * 0.3); ctx.fill();
  ctx.fillStyle = '#BFE09F';
  ctx.beginPath(); ctx.roundRect(ox - pad, oy - pad, cell * level.cols + pad * 2, cell * level.rows + pad * 2, cell * 0.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  for (let x = 0; x < level.cols; x++) for (let y = 0; y < level.rows; y++) {
    if ((x + y) % 2) ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
  }
}

function drawRock(k) {
  const [cx, cy] = centre(k), r = cell * 0.3;
  ctx.fillStyle = 'rgba(36,50,74,.2)';
  ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.75, r * 1.1, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  circle(cx + r * 0.35, cy + r * 0.15, r * 0.7, '#8E9A93');
  circle(cx - r * 0.15, cy, r, '#A3AFA8');
  circle(cx - r * 0.4, cy - r * 0.35, r * 0.35, '#C2CCC5');
}

function drawCanals(edges, t) {
  for (const [a, b] of edges) line(a, b, cell * 0.5, '#A6C98A', 0, cell * 0.07);
  for (const [a, b] of edges) line(a, b, cell * 0.48, '#E3D3AE');
  for (const [a, b] of built) line(a, b, cell * 0.48, '#A39C8A');
  for (const [a, b] of edges) line(a, b, cell * 0.3, '#B49F78');
  for (const [a, b] of built) line(a, b, cell * 0.3, '#7F786A');
  for (const [a, b] of built) {
    const [ax, ay] = centre(a), [bx, by] = centre(b);
    for (let i = 0; i < 3; i++) {
      const f = noise(a + b, i), side = noise(b + a, i) > 0.5 ? 1 : -1;
      const nx = (by - ay) / cell, ny = (ax - bx) / cell;
      circle(ax + (bx - ax) * f + nx * side * cell * 0.2, ay + (by - ay) * f + ny * side * cell * 0.2, cell * 0.035, '#6FA35A');
    }
  }
  if (!flow) return;
  for (const [a, b] of edges) {
    const f = flow.along(a);
    if (f > 1e-9) line(a, b, cell * (0.08 + 0.2 * Math.min(f, 1.4)), '#3F86F5');
  }
  ctx.setLineDash([cell * 0.06, cell * 0.273]);
  ctx.lineDashOffset = -t * 0.001 * cell;
  for (const [a, b] of edges) {
    const f = flow.along(a);
    if (f > 1e-9) line(a, b, cell * (0.03 + 0.07 * Math.min(f, 1.4)), 'rgba(255,255,255,.55)');
  }
  ctx.setLineDash([]);
}

function drawPond(t) {
  const [cx, cy] = centre(gate);
  ctx.fillStyle = 'rgba(36,50,74,.18)';
  ctx.beginPath(); ctx.ellipse(cx, cy + cell * 0.08, cell * 0.44, cell * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  circle(cx, cy, cell * 0.43, '#E3D3AE');
  circle(cx, cy, cell * 0.34, '#3F86F5');
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, cell * 0.34, 0, Math.PI * 2); ctx.clip();
  for (let i = 0; i < 2; i++) {
    const p = (t * 0.0005 + i / 2) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`;
    ctx.lineWidth = cell * 0.03;
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.34 * p, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = `800 ${Math.round(cell * 0.26)}px ui-rounded, system-ui, sans-serif`;
  ctx.fillText('1', cx, cy + 1);
}

function wedge(x, y, r, from, to, colour) {
  const top = -Math.PI / 2;
  ctx.fillStyle = colour;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.arc(x, y, r, top + from * Math.PI * 2, top + Math.min(to, 1) * Math.PI * 2);
  ctx.closePath(); ctx.fill();
}

function drawHouse(k, h) {
  const [cx, cy] = centre(k), s = cell * 0.3;
  const want = h.n / h.d, got = flow ? flow.water.get(k) || 0 : 0;
  const right = Math.abs(got - want) < 1e-7;
  ctx.fillStyle = 'rgba(36,50,74,.18)';
  ctx.beginPath(); ctx.roundRect(cx - s * 1.1, cy - s * 0.6 + 5, s * 2.2, s * 1.6, s * 0.25); ctx.fill();
  ctx.fillStyle = '#FFF7EA';
  ctx.beginPath(); ctx.roundRect(cx - s, cy - s * 0.6, s * 2, s * 1.5, s * 0.25); ctx.fill();
  ctx.fillStyle = right ? '#4CC26E' : '#F0524F';
  ctx.beginPath();
  ctx.moveTo(cx - s * 1.25, cy - s * 0.45); ctx.lineTo(cx, cy - s * 1.45); ctx.lineTo(cx + s * 1.25, cy - s * 0.45);
  ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.25; ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); ctx.fill();
  ctx.fillStyle = '#24324A';
  ctx.font = `800 ${Math.round(cell * 0.21)}px ui-rounded, system-ui, sans-serif`;
  ctx.fillText(`${h.n}/${h.d}`, cx, cy + s * 0.1);

  const gx = cx + s * 1.05, gy = cy + s * 0.95, r = cell * 0.19;
  circle(gx, gy + 2, r + 3, 'rgba(36,50,74,.18)');
  circle(gx, gy, r + 3, '#fff');
  circle(gx, gy, r, '#E6ECF3');
  wedge(gx, gy, r, 0, want, '#C9DCFB');
  wedge(gx, gy, r, 0, Math.min(got, want), right ? '#4CC26E' : '#3F86F5');
  if (got > want + 1e-7) wedge(gx, gy, r, want, got, '#F0524F');
  const a = -Math.PI / 2 + Math.min(want, 1) * Math.PI * 2;
  ctx.strokeStyle = '#24324A';
  ctx.lineWidth = Math.max(2, cell * 0.025);
  ctx.beginPath(); ctx.moveTo(gx, gy - r); ctx.lineTo(gx, gy); ctx.lineTo(gx + Math.cos(a) * r, gy + Math.sin(a) * r); ctx.stroke();
}

function drawPuddles(edges, t) {
  const tip = drawing && drawing.cells[drawing.cells.length - 1];
  for (const k of nodesOf(edges)) {
    if (k === gate || houses.has(k) || k === tip || outCount(k, edges) > 0) continue;
    const lost = flow.water.get(k) || 0;
    if (lost < 1e-9) continue;
    const [cx, cy] = centre(k), r = cell * (0.22 + 0.12 * Math.min(lost, 1)) * (1 + 0.04 * Math.sin(t * 0.004));
    ctx.fillStyle = 'rgba(63,134,245,.45)';
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.3, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r * 0.6, cy + r * 0.4, r * 0.6, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    pill(cx, cy - cell * 0.36, `${fraction(lost)} lost`, '#F0524F', '#fff');
  }
}

function draw(t) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineCap = 'round';
  drawGround();
  for (const k of rocks) drawRock(k);
  const edges = allEdges();
  drawCanals(edges, t);
  drawPond(t);
  if (flow) {
    drawPuddles(edges, t);
    for (const [a, b] of edges) {
      if (a === gate || (inCount(a, edges) === 1 && outCount(a, edges) === 1)) continue;
      const [ax, ay] = centre(a), [bx, by] = centre(b);
      pill((ax + bx) / 2, (ay + by) / 2, fraction(flow.along(a)), '#fff', '#24324A');
    }
  }
  for (const [k, h] of houses) drawHouse(k, h);
  requestAnimationFrame(draw);
}

load(Math.min(Math.max((parseInt(location.hash.slice(1)) || 1) - 1, 0), LEVELS.length - 1));
card('Even Split', 'Water splits evenly wherever a road forks. Give every house exactly its share.', 'Play', () => {});
requestAnimationFrame(draw);
</script>
</body>
</html>
